[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpcr-analyzer-cn"
version = "2.1.0"
description = "Offline qPCR relative-quantification desktop assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "qPCR Analyzer contributors" }]
dependencies = [
  "PySide6>=6.7,<7",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.9,<4",
  "XlsxWriter>=3.2,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-qt>=4.4,<5",
  "PyInstaller>=6.10,<7",
]

[project.gui-scripts]
qpcr-analyzer = "qpcr_analyzer.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
